name: Workshop CI

on:
  push:
    branches: [main, workshop-materials]
  pull_request:
    branches: [main, workshop-materials]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/backend/WebTechWorkshop.sln
      - name: Build
        run: dotnet build src/backend/WebTechWorkshop.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test src/backend/WebTechWorkshop.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install
        working-directory: src/frontend
        run: npm ci
      - name: Build
        working-directory: src/frontend
        run: npm run build
